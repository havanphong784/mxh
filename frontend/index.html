<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161819" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const theme = localStorage.getItem("mxh:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch { /* Use the system preference when storage is unavailable. */ }
    </script>
    <link rel="preload" href="/fonts/noto-sans-medium.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Đọc bài viết, trò chuyện và theo dõi những người bạn quan tâm trên MXH." />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>MXH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
